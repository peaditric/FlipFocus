name: 编译翻时专注 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: 云端构建安卓安装包
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 下载源代码
        uses: actions/checkout@v4
      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
      - name: 安装 Android 35 编译组件
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: 配置 Gradle 8.9（不用电脑安装 Android Studio）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 编译免费安装版 APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: 保存可安装的 APK
        uses: actions/upload-artifact@v4
        with:
          name: 翻时专注-Xiaomi14-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
